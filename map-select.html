<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MAP</title>
  <link rel="stylesheet" href="css/map-select.css">
</head>
<body>
<div id="game">
  <header id="top-bar">
    <div id="day-time"><span id="day">1日目</span><span id="time">08:00</span></div>
    <div id="current-location">拠点</div>
  </header>

  <main id="map-area">
    <div id="map-container" aria-label="周辺地図">
      <div class="map-road road-a"></div>
      <div class="map-road road-b"></div>
      <div class="map-home-label">HOME</div>
      <div id="map-marker-layer"></div>
    </div>
  </main>

  <section id="destination-panel">
    <div id="destination-name">行き先を選んでください</div>
    <div id="destination-info">地図上の場所をタップしてください。</div>
  </section>

  <section id="travel-panel">
    <button id="travel-button" type="button" disabled>ここへ行く</button>
  </section>

  <footer id="bottom-menu">
    <button id="home-button" type="button">拠点</button>
    <button id="inventory-button" type="button">持ち物</button>
    <button id="status-button" type="button">状態</button>
  </footer>

  <section id="inventory-panel" class="overlay-panel" hidden>
    <div class="panel-box">
      <div class="panel-header"><strong>持ち物</strong><button id="inventory-close" type="button">閉じる</button></div>
      <div id="inventory-list" class="panel-body">持ち物はHOME側のデータを使用します。</div>
    </div>
  </section>

  <section id="status-panel" class="overlay-panel" hidden>
    <div class="panel-box">
      <div class="panel-header"><strong>状態</strong><button id="status-close" type="button">閉じる</button></div>
      <div id="status-list" class="panel-body">
        <div class="status-row"><span>HP</span><span>1</span></div>
        <div class="status-row"><span>水分</span><span>100</span></div>
        <div class="status-row"><span>食欲</span><span>100</span></div>
        <div class="status-row"><span>体力</span><span>100</span></div>
        <div class="status-row"><span>衛生</span><span>100</span></div>
        <div class="status-row"><span>気分</span><span>100</span></div>
      </div>
    </div>
  </section>
</div>
<script type="module" src="js/map/map-select.js"></script>
</body>
</html>
