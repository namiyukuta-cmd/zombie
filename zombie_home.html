<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Zombie - Home</title>

  <link rel="stylesheet" href="css/zombie-home.css">
</head>

<body>

<div id="game">

  <header id="hud">
    <div id="date"></div>
    <div id="time"></div>
    <div id="location"></div>
    <div id="light-level"></div>
  </header>


  <main id="home-area">
    <canvas id="home-world"></canvas>
  </main>


  <section id="message"></section>


  <section id="controls"></section>


  <section id="home-panel">

    <div id="inventory"></div>

    <div id="storage"></div>

    <a
      href="town.html"
      style="grid-column:1/-1;min-height:48px;display:flex;align-items:center;justify-content:center;border:2px solid #716757;border-radius:9px;background:#e6eee1;color:#2f2c28;font-size:17px;font-weight:700;text-decoration:none;touch-action:manipulation;"
    >町へ行く</a>

  </section>

</div>


<script type="module" src="js/home.js"></script>

</body>
</html>
